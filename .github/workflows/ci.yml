name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); the comment is the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No signing secrets in the repo
        run: |
          if git grep -nE '^\s*linkguard\.(keystore|key)\.?|storePassword\s*=\s*"|keyPassword\s*=\s*"' -- . ':!.github/workflows/ci.yml' ':!app/build.gradle.kts'; then
            echo "::error::Signing properties belong in ~/.gradle/gradle.properties, never in the repo."
            exit 1
          fi
          if git ls-files | grep -iE '\.(jks|keystore|pem|key|p12|pfx)$|(^|/)(\.env(\..*)?|\.dev\.vars|google-services\.json)$'; then
            echo "::error::Key and credential files must never be committed."
            exit 1
          fi
          if git grep -nIE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'gh[pousr]_[A-Za-z0-9]{36}' -e 'github_pat_[A-Za-z0-9_]{40,}' -e 'AKIA[0-9A-Z]{16}' -e 'AIza[0-9A-Za-z_-]{35}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A private key or API token is committed. Remove it and rotate it."
            exit 1
          fi

      - name: Every language has every string
        run: python3 scripts/check_strings.py

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Core and feeds tests (includes the corpus)
        run: ./gradlew :core:test :feeds:test --console=plain

      - name: Library API unchanged and publishable (unsigned)
        run: |
          ./gradlew :core:checkLegacyAbi :core:publishAllPublicationsToStagingRepository :data:publishAllPublicationsToStagingRepository --console=plain
          scripts/central_bundle.sh --dry-run

      - name: App unit tests, builds and lint
        run: ./gradlew :app:testFossDebugUnitTest :app:assembleFossDebug :app:assemblePlayDebug :app:lintFossDebug --console=plain

      - name: foss flavour has no Google dependencies
        run: |
          ./gradlew :app:dependencies --configuration fossReleaseRuntimeClasspath --console=plain > foss-deps.txt
          if grep -E 'com\.google\.android\.gms|com\.google\.firebase|com\.google\.android\.play' foss-deps.txt; then
            echo "::error::The foss flavour must not depend on Google Play services, Firebase or Play libraries."
            exit 1
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            core/build/reports/tests/
            app/build/reports/
