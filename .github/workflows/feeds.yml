name: Feeds

# Daily refresh of the LinkGuard server lists from public feeds (URLhaus malware hosts, PhishDestroy and PhishTank
# phishing and scam domains, Tranco top sites; terms in feeds/SOURCES.md). Results go straight to the private server database;
# nothing is committed. The log prints counts only, because logs of this public repository are public.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the server database (otherwise dry run)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Refresh lists
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LINKGUARD_D1_ID: ${{ vars.LINKGUARD_D1_ID }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            ./gradlew :feeds:run --args="--apply" --console=plain -q
          else
            ./gradlew :feeds:run --console=plain -q
          fi
